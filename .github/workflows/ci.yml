name: HazartGo CI

on:
  workflow_dispatch:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.22'
        cache: true

    - name: Install dependencies
      run: go mod download

    - name: Run Unit Tests
      run: go test -v ./...

    - name: Build Hazart CLI
      run: go build -v ./cmd/hazart
